name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tools/contest-playlist-builder -v
      - name: Install DJ Set Processor dependencies
        working-directory: tools/dj-set-processor
        run: python -m pip install -r requirements.txt
      - name: Run DJ Set Processor tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        working-directory: tools/dj-set-processor
        run: python -m unittest discover -s tests -v
      - name: Install Westie Radio dependencies
        working-directory: tools/westie-radio
        run: python -m pip install -r requirements.txt
      - name: Run Westie Radio tests
        working-directory: tools/westie-radio
        run: python -m unittest discover -s tests -v
